# 金箍棒配置 — 触发词「投诉分析配置」可交互修改本文件
# 改任意值后下次运行生效；恢复默认 = 按本文件注释里的默认值改回

路径:
  数据区: ./work/客户投诉分析
  预警点文件: ./knowledge/tools/投诉预警点/当前预警点.md
  活动方案库INDEX: ./knowledge/活动方案库/INDEX.md

分析模型:
  排名分析:     {启用: true, TopN: 10, 时间窗: [本月, 今年, 全量]}
  环比同比:     {启用: true, 阈值: 0.20, 绝对增量门槛: 5}       # 双向±；正向橙警，负向仅报告提示
  超时分析:     {启用: true, 超时率阈值: 0.10}                  # 先全行后部门；仅督办表
  督办投诉比照: {启用: true, 回看月数: 3, 月均笔数: 20, 命中门槛: 10}  # 红警来源；TopN与排名分析联动（同惯犯）；2026-07-08按真实数据规模校准（原5/3在3800+条/月规模下几乎覆盖半数问题点，红警失真）
  集中度:       {启用: true}                                    # Top5占比，仅投诉表
  新面孔:       {启用: true, 门槛: 3}                           # 黄警
  惯犯:         {启用: true, 连续月数: 3}                        # 升格候选池，TopN与排名分析联动
  活动关联:     {启用: true}                                    # 在途活动/系统变更关联投诉专章

深挖:
  深挖预警级别: [红, 橙]      # 黄警默认不深挖
  单批上限字数: 15000         # 所有LLM读取统一切批
  子代理隔离阈值字数: 50000    # 超过则整个深挖交子代理
  单问题点抽样上限条数: 150    # 超过上限的问题点随机抽样(seed=42)而非全量精读；2026-07-08真实数据规模下引入（借记卡限额类问题点单月即超千条，全量不现实）
  总预算字数: 300000          # 超过先报数问用户；2026-07-13 临时授权曾调至200万用于补跑12个红警，授权结束后恢复默认值

产出物开关: {md报告: true, docx: true, 预警清单: true, 预警点文件: true, html报告: true}
