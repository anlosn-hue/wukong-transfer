# 红孩儿配置 — 触发词「红孩儿配置」可交互修改本文件
# 改任意值下次运行生效；恢复默认 = 按注释里的默认值改回

路径:
  数据区: ./work/舆情监测/小红书
  登录态目录: .state          # 相对技能目录；gitignore，不云同步
  台账文件: .runtime\台账.jsonl # 相对技能目录；gitignore

通道:
  默认: playwright            # playwright | thirdparty（thirdparty v1 未接入）

漏斗:
  A层互动阈值: {点赞: 50, 收藏: 20, 评论: 5}   # 任一超阈即视为高互动
  A层时间窗天数: 30                            # 只收 N 天内新帖；命令行可覆盖
  B层抓取上限: 10                              # A 层筛中笔记里最多抓正文的篇数
  C层下钻上限: 3                               # B 层高风险笔记里最多抓评论的篇数
  风险语气词: [未到账, 没到账, 领不到, 骗, 套路, 投诉, 垃圾, 坑, 客服, 退款, 维权, 黑猫]
  # 风险语气词=A层筛选用；命中标题/摘要即认为值得进入B层研判

合规:
  单日查询上限: 20            # 一台机器一天最多发起几次查询；硬上限，超出拒绝
  会话内抓取上限: 40          # 单次运行跨三层累计抓取动作封顶
  请求间隔秒: [2, 6]          # 每次抓取动作之间随机 sleep 区间（低频克制访问）

产出物开关: {报告md: true, 保留原始抓取: false}  # 保留原始抓取=false 即用后即焚
